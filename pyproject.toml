[project]
name = "portwright"
version = "0.1.0"
description = "A harness that ports Python libraries to Rust and reports how closely the port matches."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["hypothesis>=6.100", "pytest>=8", "coverage>=7.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "runs", "target"]
markers = ["docker: needs the Rust toolchain Docker image"]
