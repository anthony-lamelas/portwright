[package]
name = "isodate-port-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Python bindings for the experimental, unofficial Rust port of isodate."

[lib]
name = "isodate"
crate-type = ["cdylib"]

[dependencies]
isodate-port-core = { path = "../isodate-port-core" }
pc-datetime-port-core = { path = "../../vendor/pc_datetime" }
pc-re-port-core = { path = "../../vendor/pc_re" }
num-bigint = "0.4"
pyo3 = { version = "0.29", features = ["extension-module", "num-bigint"] }
