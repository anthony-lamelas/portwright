[package]
name = "parse-port-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Experimental, unofficial Rust port of parse."

[lib]
bench = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indexmap = "2"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
regex = "1"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "parse"
harness = false
