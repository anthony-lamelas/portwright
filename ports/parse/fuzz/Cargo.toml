[package]
name = "parse-port-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
indexmap = "2"
parse-port-core = { path = "../crates/parse-port-core" }

# Keep this crate out of any parent workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extract_format"
path = "fuzz_targets/extract_format.rs"
test = false
doc = false
bench = false

