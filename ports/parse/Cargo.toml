[workspace]
resolver = "2"
members = ["crates/parse-port-core", "crates/parse-port-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
# Python integers never overflow, so an unexpected overflow must never wrap silently.
overflow-checks = true
lto = "fat"
codegen-units = 1
