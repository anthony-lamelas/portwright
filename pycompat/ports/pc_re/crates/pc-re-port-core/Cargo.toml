[package]
name = "pc-re-port-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Experimental, unofficial Rust port of pc_re."

[lib]
bench = false

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
indexmap = "2"
smallvec = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "api"
harness = false
