[workspace]
resolver = "2"
members = ["crates/pc-re-port-core", "crates/pc-re-port-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
# Python integers never overflow, so an unexpected overflow must never wrap silently.
overflow-checks = true
# Whole-program optimization: the bindings call small core functions on every
# call, and the matcher benefits from cross-module inlining.
lto = "fat"
codegen-units = 1
