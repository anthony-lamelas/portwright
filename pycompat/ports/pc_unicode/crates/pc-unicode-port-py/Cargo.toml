[package]
name = "pc-unicode-port-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Python bindings for the experimental, unofficial Rust port of pc_unicode."

[lib]
name = "pc_unicode"
crate-type = ["cdylib"]

[dependencies]
pc-unicode-port-core = { path = "../pc-unicode-port-core" }
pyo3 = { version = "0.29", features = ["extension-module", "num-bigint"] }
num-bigint = "0.4"
