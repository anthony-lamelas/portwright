[package]
name = "pc-unicode-port-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
num-bigint = "0.4"

[dependencies.pc-unicode-port-core]
path = "../crates/pc-unicode-port-core"

# Keep this crate out of any parent workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "bidirectional"
path = "fuzz_targets/bidirectional.rs"
test = false
doc = false
bench = false

