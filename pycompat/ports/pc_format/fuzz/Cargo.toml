[package]
name = "pc-format-port-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
num-bigint = "0.4"

[dependencies.pc-format-port-core]
path = "../crates/pc-format-port-core"

# Keep this crate out of any parent workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "div_mod"
path = "fuzz_targets/div_mod.rs"
test = false
doc = false
bench = false

