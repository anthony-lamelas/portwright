[package]
name = "pc-datetime-port-core-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[lib]
name = "pc_datetime_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
num-bigint = "0.4"
pc-datetime-port-core = { path = "../crates/pc-datetime-port-core" }

# Keep this crate out of the port's workspace.
[workspace]

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "make_date"
path = "fuzz_targets/make_date.rs"
test = false
doc = false
bench = false

